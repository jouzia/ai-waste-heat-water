[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-waste-heat-water"
version = "0.1.0"
description = "Reproducible modeling framework for AI infrastructure waste-heat recovery and net freshwater impact."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.7", "pyyaml>=6.0", "iapws>=1.5.4"]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "scipy>=1.13", "matplotlib>=3.8", "SALib>=1.5", "xlrd>=2.0.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
