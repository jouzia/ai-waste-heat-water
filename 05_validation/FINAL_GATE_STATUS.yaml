  note: "This file is a hard status declaration. No gate may be marked true without a reproducible artifact and provenance record. Primary-observation extraction is true for the 12-condition GDR/NREL Villa et al. 3M workbook summary and 631-row source-linked ledger, plus Ali et al. (2020) source-linked raw (17,430 rows), transient (17,385 rows), and steady-state (16 observations) ledgers archived in a checksummed 90-day artifact. The Ali transient traces are not dynamic validation of the current steady-state model; the separate 1999 Martínez-Díez source benchmark remains unextracted. An internal S1 grouped leave-one-flow-out comparison now holds out each of 50/100/200/300 L/h in turn. The fixed-TPC/single-permeance form has aggregate out-of-fold MAE 0.571 kg m⁻² h⁻¹ (RMSE 0.688), while a three-parameter flow-dependent-TPC form has MAE 0.116 (RMSE 0.144) under the stated 0.5% salinity interpretation; the TDS_E proxy gives similar but not identical results. All four folds favor the flexible form, but this is within-source cross-validation on only 16 observations and does not pass independent validation or final model-form gates. See `docs/ALI_2020_LEAVE_ONE_FLOW_OUT_2026-10-14.md`. The default 10 m²/50 L/h transient reconstruction also produced an inadmissible outlet state and now rejects it; dynamic source reconstruction remains unvalidated. A 17-case lumped transient admissibility matrix rejected all 16 source-scale variants (hot outlet minima 11.615–15.984 °C for a 60/25 °C inlet trace); only the 0.1 m² numerical control passed. The failure-analysis record is `docs/ALI_DYNAMIC_MODEL_FAILURE_ANALYSIS_2026-10-13.md`. A measured 30-minute S2 Data worksheet-50 warm-up trace also rejects both unrefitted lumped cases: predicted hot-outlet minima 4.987 °C (no correction) and 4.557 °C (published correction), below the measured-trace envelope [18.750, 61.290] °C; see workflow run #14 and artifact 11831163647. The 3-cell coarse spatial model also fails the same measured-trace envelope (hot-outlet minima 17.802 °C without correction and 17.362 °C with the published spatial correction); see workflow run #26, artifact 11832214020. The 10-cell spatial model is physically admissible on the full 1,662-row S2/50 trace; temperature RMSE is 0.324 °C hot-side and 4.980 °C cold-side without correction, and 0.363 °C hot-side and 2.457 °C cold-side with the published 0.15 correction. However, all mass-error metrics previously reported from runs #27–#30 are withdrawn as invalid; the current extraction audit covers 19 complete timed worksheet traces, 14 of which have nonmonotonic raw `mw` values, and therefore cumulative-mass semantics remain unverified; the raw `mw (kg)` field is nonmonotonic in 14 of 19 complete timed worksheet traces. The extractor now preserves `mw_raw_reading_kg`, leaves `cumulative_distillate_mass_kg` unset, and disables tail-slope flux comparisons. Predicted cumulative mass is retained as a model output only and is not compared to raw `mw`. Workflow run #30 artifact 11832547979 contains the raw source series and time-indexed temperature residuals. The pre-registered S3/60 held-out trace has been evaluated without refitting: 10-cell spatial-model hot/cold outlet RMSE is 2.079/3.323 °C without correction and 2.173/2.643 °C with the published correction; raw mass comparison remains unavailable. See `docs/ALI_2020_HELDOUT_TRACE_RESULTS_2026-10-13.md`. The dynamic model now includes piecewise-linear boundary derivatives, segmented thermal integration, cached IAPWS properties, and trapezoidal mass-state integration. A five-case 5/10/20-cell and 1e-4/1e-6 tolerance study shows numerical grid/tolerance behavior is partly stable (10-cell vs 20-cell reference hot-outlet RMSE 0.00315 °C; cold-outlet RMSE 0.0722 °C; mass-rate RMSE 0.0485 kg/h), but model-to-measurement cold-outlet RMSE remains about 4.98–5.01 °C and source mass-field semantics remain unresolved; source reconstruction is therefore still blocked. See `docs/ALI_2020_SPATIAL_GRID_TOLERANCE_CONVERGENCE_2026-10-13.md`. A four-run independent-seed Monte Carlo convergence audit (50k, 50k, 50k, 100k draws) passed all predeclared numerical tolerances: net-water P05 spread 4.58%, negative-sign fraction spread 0.131 percentage points, net-water P95 spread 0.437%, and freshwater-output P95 spread 0.337 L. The Monte Carlo convergence gate is true only for numerical stability under illustrative scenario ranges; the inputs remain uncalibrated and the result is not a real-world probability. A higher-resolution nested Sobol run at 4,096/8,192 samples per matrix has identical top-five freshwater total-effect rankings (max total-effect delta 0.02885; max rank shift 0), and net-water max total-effect delta 0.00182. This improves numerical convergence evidence but remains conditional on illustrative independent-uniform ranges and the unvalidated model; see `docs/GLOBAL_SENSITIVITY_PROTOCOL.md`. The GDR transfer-correlation/geometry run is a within-workbook diagnostic and does not satisfy independent held-out validation or the final validation-grade model-form gate. The publication_gate.py script now checks that status is COMPLETE and every scientific gate is true; it is expected to fail while this status is INCOMPLETE. Direct prior art from Kanbur (2020), Wyon (2025), Chen (2026), Yang (2026), Katakam et al. (online 2026; DOI 10.1016/j.watres.2026.126748), and Wang et al. (2026; DOI 10.1016/j.ese.2026.100702) materially narrows the novelty claim. The targeted audit is recorded in `docs/PRIOR_ART_GAP_AUDIT_2026-10-14.md`; it is not a systematic review and full-text comparisons remain incomplete. The primary 1999 observation extraction remains blocked by lack of verified accessible full text."
