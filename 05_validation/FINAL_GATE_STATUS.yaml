  note: "This file is a hard status declaration. No gate may be marked true without a reproducible artifact and provenance record. Primary-observation extraction is true for the 12-condition GDR/NREL Villa et al. 3M workbook summary and 631-row source-linked ledger, plus Ali et al. (2020) source-linked raw (17,430 rows), transient (17,385 rows), and steady-state (16 observations) ledgers archived in a checksummed 90-day artifact. The Ali transient traces are not dynamic validation of the current steady-state model; the separate 1999 Martínez-Díez source benchmark remains unextracted. An internal S1 flux-law comparison shows a fixed-TPC model underpredicting held-out 300 L/h flux (MAE 0.828 kg m⁻² h⁻¹); a fitted flow-dependent-TPC alternative improves this to MAE 0.181 but is only within-source held-out diagnostics. The default 10 m²/50 L/h transient reconstruction also produced an inadmissible outlet state and now rejects it; dynamic source reconstruction remains unvalidated. A 17-case lumped transient admissibility matrix rejected all 16 source-scale variants (hot outlet minima 11.615–15.984 °C for a 60/25 °C inlet trace); only the 0.1 m² numerical control passed. The failure-analysis record is `docs/ALI_DYNAMIC_MODEL_FAILURE_ANALYSIS_2026-10-13.md`. A measured 30-minute S2 Data worksheet-50 warm-up trace also rejects both unrefitted lumped cases: predicted hot-outlet minima 4.987 °C (no correction) and 4.557 °C (published correction), below the measured-trace envelope [18.750, 61.290] °C; see workflow run #14 and artifact 11831163647. The 3-cell coarse spatial model also fails the same measured-trace envelope (hot-outlet minima 17.802 °C without correction and 17.362 °C with the published spatial correction); see workflow run #26, artifact 11832214020. The 10-cell spatial model is physically admissible on the full 1,662-row S2/50 trace; temperature RMSE is 0.324 °C hot-side and 4.980 °C cold-side without correction, and 0.363 °C hot-side and 2.457 °C cold-side with the published 0.15 correction. However, all mass-error metrics previously reported from runs #27–#30 are withdrawn as invalid; the current extraction audit covers 19 complete timed worksheet traces, 14 of which have nonmonotonic raw `mw` values, and therefore cumulative-mass semantics remain unverified; the raw `mw (kg)` field is nonmonotonic in 14 of 19 complete timed worksheet traces. The extractor now preserves `mw_raw_reading_kg`, leaves `cumulative_distillate_mass_kg` unset, and disables tail-slope flux comparisons. Predicted cumulative mass is retained as a model output only and is not compared to raw `mw`. Workflow run #30 artifact 11832547979 contains the raw source series and time-indexed temperature residuals. The pre-registered S3/60 held-out trace is being evaluated under the same mass-semantics restriction. The dynamic model now includes piecewise-linear boundary derivatives, segmented thermal integration, cached IAPWS properties, and trapezoidal mass-state integration; source-scale reconstruction remains a hard blocker until the spatial model is physically admissible and numerical convergence is demonstrated. A 20,000-draw scenario-only Monte Carlo and 512/2,048-point Sobol analysis now execute reproducibly, but the lower quantile and freshwater-output Sobol indices need further convergence checks; the Monte Carlo convergence gate therefore remains false. The GDR transfer-correlation/geometry run is a within-workbook diagnostic and does not satisfy independent held-out validation or the final validation-grade model-form gate. The publication_gate.py script now checks that status is COMPLETE and every scientific gate is true; it is expected to fail while this status is INCOMPLETE. Direct prior art from Kanbur (2020), Wyon (2025), Chen (2026), Yang (2026), and Katakam et al. (2026 online-ahead-of-print) materially narrows the novelty claim; a recent system-scale desalination-for-data-centres paper was added to `docs/WYON_2025_THESIS_PRIOR_ART_AUDIT.md` and still requires full-text comparison."
