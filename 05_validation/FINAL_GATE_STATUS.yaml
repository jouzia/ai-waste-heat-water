  note: "This file is a hard status declaration. No gate may be marked true without a reproducible artifact and provenance record. Primary-observation extraction is true for the 12-condition GDR/NREL Villa et al. 3M workbook summary and 631-row source-linked ledger, plus Ali et al. (2020) source-linked raw (17,430 rows), transient (17,385 rows), and steady-state (16 observations) ledgers archived in a checksummed 90-day artifact. The Ali transient traces are not dynamic validation of the current steady-state model; the separate 1999 Martínez-Díez source benchmark remains unextracted. An internal S1 flux-law comparison shows a fixed-TPC model underpredicting held-out 300 L/h flux (MAE 0.828 kg m⁻² h⁻¹); a fitted flow-dependent-TPC alternative improves this to MAE 0.181 but is only within-source held-out diagnostics. The default 10 m²/50 L/h transient reconstruction also produced an inadmissible outlet state and now rejects it; dynamic source reconstruction remains unvalidated. A 17-case lumped transient admissibility matrix rejected all 16 source-scale variants (hot outlet minima 11.615–15.984 °C for a 60/25 °C inlet trace); only the 0.1 m² numerical control passed. The failure-analysis record is `docs/ALI_DYNAMIC_MODEL_FAILURE_ANALYSIS_2026-10-13.md`. The dynamic model now includes piecewise-linear boundary derivatives and the spatial solver uses configured effective membrane area, but source-scale reconstruction remains a hard blocker. A 20,000-draw scenario-only Monte Carlo and 512/2,048-point Sobol analysis now execute reproducibly, but the lower quantile and freshwater-output Sobol indices need further convergence checks; the Monte Carlo convergence gate therefore remains false. The GDR transfer-correlation/geometry run is a within-workbook diagnostic and does not satisfy independent held-out validation or the final validation-grade model-form gate. The publication_gate.py script now checks that status is COMPLETE and every scientific gate is true; it is expected to fail while this status is INCOMPLETE. Direct prior art from Kanbur (2020), Wyon (2025), Chen (2026), Yang (2026), and Katakam et al. (2026 online-ahead-of-print) materially narrows the novelty claim; a recent system-scale desalination-for-data-centres paper was added to `docs/WYON_2025_THESIS_PRIOR_ART_AUDIT.md` and still requires full-text comparison."
