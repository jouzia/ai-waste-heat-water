    configuration: "flat-sheet DCMD"
    extraction_status: source_formulation_reconciled_execution_matrix_ready
    validation_status: candidate
    benchmark_file: "04_experiments/literature_benchmarks/MD-DCMD-CHANNEL-2020.yaml"
    execution_matrix: "04_experiments/literature_benchmarks/MD-DCMD-CHANNEL-2020_execution_matrix.yaml"
    claim_status: "Source equations and counter-current runner implemented; no predictive accuracy claim until primary observations and exact boundary conditions are crosswalked and compared unfitted."

