version: "1.0"

purpose: "Immutable registry of literature cases considered for quantitative membrane-distillation validation."

status_definitions:
  candidate: "Source identified; quantitative reconstruction not yet completed."
  eligible: "Required boundary conditions are available for reconstruction."
  parameterized: "Machine-readable case extracted; no model comparison completed."
  validated_development: "Compared during model development or fitting; not held-out evidence."
  validated_held_out: "Compared without fitting parameters to that case."
  excluded: "Insufficient information or incompatible system boundary."
  qualitative_only: "Useful scientific evidence but not reproducible quantitatively."

cases:
