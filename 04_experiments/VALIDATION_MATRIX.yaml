    role: development_benchmark
    source: "Keshavarzzadeh et al. (2020), Scientific Reports 10, 16790"
    doi: "10.1038/s41598-020-73964-7"
    upstream_experiment: "Martínez-Díez & Vázquez-González (1999), J. Membrane Science 156, 265-273"
    configuration: "flat-sheet counter-current DCMD"
    source_facts:
      recirculation_rates_cm3_s: [7.0, 11.0]
      nacl_concentrations_mol_l: [0.0, 0.55, 1.15, 1.67]
      membrane_material: PTFE
      membrane_void_fraction: 0.80
      membrane_thickness_um: 60.0
      primary_pore_size_um: 0.2
      module_geometry:
        channels_each_side: 9
        channel_length_mm: 55.0
        channel_width_mm: 7.0
        channel_height_mm: 0.45
        effective_membrane_area_m2: 0.00337
      source_text_discrepancy:
        keshavarzzadeh_2020: "0.2 mm nominal pore size"
        martinez_diez_1999: "0.2 um nominal pore size"
        resolution: "Primary 1999 specification is retained for experimental provenance; the 2020 printed unit is preserved as a documented discrepancy."
    model_status: "counter-current solver implemented; primary module geometry reconciled; source-condition reconstruction and marker extraction incomplete"
    quantitative_claim: false
