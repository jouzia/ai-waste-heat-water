required_fields:
  - observation_id
  - source_article_doi
  - supporting_data_id
  - workbook_filename
  - source_file_sha256
  - worksheet_name
  - excel_row_1based
  - nominal_flow_l_h
  - hot_inlet_target_c
  - measured_hot_inlet_temperature_c
  - measured_cold_inlet_temperature_c
  - time_min
  - cumulative_distillate_mass_kg
  - circulation_flow_l_h_raw
  - row_status
  - raw_header_json
  - raw_row_json

rules:
  - "Preserve measured accumulated mass as the primary observation."
  - "Keep source-derived rate curves and source-model predictions in separate fields/tables."
  - "Do not use extrapolated steady-state mass-production lines as raw measurements."
  - "Retain source checksums, sheet names, and one-based Excel row locators."
  - "Temperature-only rows without timestamps remain in the ledger but are excluded from time-domain fitting."
  - "Do not impute missing time points or boundary conditions without an explicit method."
  - "The 25% and 10% tail-slope checks are within-paper consistency diagnostics, not independent validation."
  - "Lock development/held-out operating conditions before fitting."
