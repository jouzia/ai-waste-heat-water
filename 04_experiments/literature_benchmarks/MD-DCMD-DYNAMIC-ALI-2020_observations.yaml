rules:
  - "Record workbook checksum, retrieval date, and worksheet names."
  - "Preserve measured accumulated mass as the primary observation."
  - "Keep source-derived rate curves and source-model predictions in separate fields/tables."
  - "Do not use extrapolated steady-state mass-production lines as raw measurements."
  - "Retain reported uncertainty and identify repeated-run versus digitization uncertainty."
  - "Record heater lag and cold-inlet temperature fluctuations where data are available."
  - "Do not impute missing time points or boundary conditions without an explicit method."
  - "Lock development/held-out operating conditions before fitting."
