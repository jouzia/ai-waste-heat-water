dataset_description: "Experimental data and membrane/module specifications for CLARCOR, 3M, and Aquastill membranes in counter-current DCMD, co-current DCMD, and air-gap MD configurations. The GDR landing page describes generic Data and Theoretical worksheets; the selected 3M workbook actually contains 12 temperature-condition time-series sheets plus Specifications and Theoretical, with no worksheet literally named Data."
experimental_provenance:
  organization: "Colorado School of Mines, Advanced Water Technology Center; National Renewable Energy Laboratory / Sandia National Laboratories dataset authors"
  dataset_date: "2018-03-01"
  membrane_configurations:
    - "3M 0.2 micron plate-and-frame counter-current DCMD"
    - "Aquastill 0.3 micron plate-and-frame counter-current DCMD"
    - "Aquastill 0.3 micron spiral-wound counter-current DCMD"
    - "Aquastill polyethylene spiral-wound counter-current DCMD"
    - "CLARCOR QL822 flat-sheet co-current DCMD"
    - "CLARCOR QL822 flat-sheet counter-current DCMD"
    - "CLARCOR QL822 flat-sheet air-gap MD"
  reported_base_conditions:
    salinity_g_l_nacl: 4.0
    selected_flow_rates: "configuration-specific; see individual workbook specification sheets"
    membrane_area_m2: "configuration-specific; see individual workbook specification sheets"
  files:
    - "3M 0.2 Micron Plate and Frame Countercurrent DCMD.xls"
    - "Aquastill 0.3 Micron Plate and Frame Counter-Current DCMD .xls"
    - "Aquastill 0.3 Micron Spiral Wound Countercurrent DCMD .xls"
    - "Aquastill Polyethylene Spiral Wound Countercurrent DCMD.xls"
    - "CLARCOR QL822 Flat Sheet Cocurrent DCMD.xls"
    - "CLARCOR QL822 Flat Sheet Counter-Current DCMD.xls"
    - "CLARCOR QL822 Flat Sheet Air-Gap MD.xls"
extraction_rules:
  - "Retrieve a single workbook with `python scripts/download_gdr_villa.py --dataset clarcor-countercurrent`; use `--dataset all` for all seven files. The script writes a SHA-256 manifest and stores raw files locally under the git-ignored data/raw directory."
  - "Extract measured experimental observations only; never treat theoretical/model worksheets as observations."
  - "Keep each workbook and configuration as a separate source case."
  - "Record worksheet name, row/cell locator, units, and original column headings for every extracted value."
  - "Preserve raw workbook, checksum, retrieval date, and licence metadata in the private/reproducibility manifest; do not commit the full 96 MB archive without a storage/legal review."
  - "Convert units in a separate transformation layer; never overwrite raw values."
  - "Do not calibrate membrane coefficients against held-out cases."
  - "Split development and held-out configurations before parameter fitting."
  - "Report whether operating conditions and membrane geometry fall inside the model's applicability domain."
  - "Attribute the dataset under CC BY 4.0, link the licence, and state changes. Keep measured Data-sheet values separate from calculated values in Theoretical sheets."
validation_use:
  intended: "Candidate independent experimental benchmark for the modern 1-D DCMD model and heat/mass-transfer correlation comparison."
  not_intended: "Not direct validation of the Keshavarzzadeh 2020 source-specific implementation unless geometry, membrane, salinity, and boundary conditions are reconstructed to match."
  quantitative_status: "No model-vs-data results yet; extraction and source-condition crosswalk pending."
