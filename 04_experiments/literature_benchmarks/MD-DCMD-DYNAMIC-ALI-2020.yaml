validation_role:
  intended: "Candidate open transient dataset for testing whether a time-varying DCMD model captures startup and stepped-input mass-production response."
  not_intended: "Not direct validation of the current steady-state/lumped net-water engine without implementing and validating transient states."
  source_model_note: "The paper reports substantial mismatch for uncorrected lumped/spatial models and improved fit after adding a tuned heat-loss correction. Treat this as evidence of model-form risk; do not copy its fitted correction or call the same fitted cases independent validation."
extraction_rules:
  - "Retrieve the publisher-supplied XLSX supplements and record retrieval date, checksum, and worksheet names."
  - "Separate raw measured accumulated mass from source-derived production rates, extrapolated curves, and model outputs."
  - "Preserve reported measurement uncertainty and the 10-second sampling interval."
  - "Record the step-input time course; the heater input is not instantaneous and the cold inlet temperature fluctuates."
  - "Use measured time series only as observations; source-model outputs are not observations."
  - "Pre-register development and held-out operating conditions before any fitting."
  - "Report transient error metrics separately from steady-state flux metrics."
  - "Do not claim dynamic validation until the time-dependent model and exact input histories are reconstructed."


