name: Scenario-only uncertainty execution

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_scenario_uncertainty_study.py"
      - "src/ai_water/monte_carlo.py"
      - "src/ai_water/global_sensitivity.py"
      - "src/ai_water/study_analysis.py"
      - ".github/workflows/scenario-uncertainty.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-scenario-uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research package
        run: python -m pip install -e .

      - name: Run Monte Carlo, convergence diagnostics, and Sobol analysis
        run: python scripts/run_scenario_uncertainty_study.py --output-dir artifacts/scenario_uncertainty

      - name: Verify reproducibility manifest and analysis coverage
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/scenario_uncertainty")
          manifest = json.loads((root / "manifest.json").read_text())
          summary = json.loads((root / "scenario_uncertainty_summary.json").read_text())
          for name, expected in manifest["sha256"].items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual == expected, (name, expected, actual)
          with (root / "monte_carlo_samples.csv").open(encoding="utf-8", newline="") as stream:
              mc_rows = list(csv.DictReader(stream))
          with (root / "sobol_indices.csv").open(encoding="utf-8", newline="") as stream:
              sobol_rows = list(csv.DictReader(stream))
          assert len(mc_rows) == 10000
          assert len(sobol_rows) == 2 * 2 * 16
          assert summary["monte_carlo"]["failed_samples"] == 0
          assert summary["claim_limits"]
          print("Verified 10,000 Monte Carlo draws, 64 Sobol index rows, and all output checksums.")
          print("Scenario-only result; not empirical validation.")
          PY

      - name: Upload reproducible scenario outputs
        uses: actions/upload-artifact@v4
        with:
          name: scenario-only-uncertainty-study
          path: artifacts/scenario_uncertainty/*
          if-no-files-found: error
          retention-days: 90
