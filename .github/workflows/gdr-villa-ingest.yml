name: GDR DCMD source-data ingestion

on:
  push:
    branches: [main]
    paths:
      - "scripts/download_gdr_villa.py"
      - "scripts/extract_gdr_villa_flux_summary.py"
      - "scripts/extract_gdr_villa_observation_ledger.py"
      - ".github/workflows/gdr-villa-ingest.yml"
  pull_request:
    paths:
      - "04_experiments/literature_benchmarks/MD-OEDI-VILLA-2018.yaml"
      - "scripts/download_gdr_villa.py"
      - "scripts/extract_gdr_villa_flux_summary.py"
      - "scripts/extract_gdr_villa_observation_ledger.py"
      - ".github/workflows/gdr-villa-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install legacy XLS reader
        run: python -m pip install "xlrd>=2.0.1"

      - name: Retrieve selected CC BY 4.0 workbook
        run: python scripts/download_gdr_villa.py --dataset 3m-countercurrent

      - name: Inspect workbook and export sheets
        run: |
          python scripts/inspect_gdr_villa.py
          mkdir -p artifacts/gdr_villa_exports
          python - <<'PY'
          import csv
          import json
          import re
          from collections import Counter
          from pathlib import Path

          import xlrd

          source = Path("data/raw/gdr_villa_2018/3M 0.2 Micron Plate and Frame Countercurrent DCMD.xls")
          out = Path("artifacts/gdr_villa_exports")
          out.mkdir(parents=True, exist_ok=True)
          workbook = xlrd.open_workbook(str(source), on_demand=True)
          index = []
          for sheet in workbook.sheets():
              safe_name = re.sub(r"[^A-Za-z0-9._-]+", "_", sheet.name).strip("_") or "sheet"
              csv_path = out / f"{safe_name}.csv"
              with csv_path.open("w", newline="", encoding="utf-8-sig") as stream:
                  writer = csv.writer(stream)
                  for row_index in range(sheet.nrows):
                      writer.writerow(sheet.row_values(row_index))
              types = Counter(
                  str(sheet.cell_type(row, col))
                  for row in range(sheet.nrows)
                  for col in range(sheet.ncols)
              )
              index.append({
                  "sheet_name": sheet.name,
                  "rows": sheet.nrows,
                  "columns": sheet.ncols,
                  "csv_file": csv_path.name,
                  "cell_type_counts_xlrd": dict(types),
                  "preview_first_6_rows_first_12_columns": [
                      [sheet.cell_value(row, col) for col in range(min(sheet.ncols, 12))]
                      for row in range(min(sheet.nrows, 6))
                  ],
                  "interpretation": (
                      "mixed steady-state experimental and calculated values; exclude calculated columns"
                      if sheet.name.strip().lower() == "theoretical"
                      else "full-data sheet; inspect each column's provenance and units"
                      if sheet.name.strip().lower() == "data"
                      else "worksheet exported for inspection; not automatically classified as observations"
                  ),
              })
          workbook.release_resources()
          manifest = {
              "source_doi": "10.15121/1452747",
              "source_page": "https://gdr.openei.org/submissions/1016",
              "license": "CC BY 4.0",
              "license_url": "https://creativecommons.org/licenses/by/4.0/",
              "source_workbook": source.name,
              "source_sha256": __import__("hashlib").sha256(source.read_bytes()).hexdigest(),
              "sheets": index,
              "scope_note": "Raw workbook is included. CSV files are value exports for inspection, not an observation ledger; validate sheet, column, unit, and measurement provenance before using any values as experimental targets.",
          }
          (out / "sheet_export_manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Recreate condition-level flux summary from raw time series
        run: python scripts/extract_gdr_villa_flux_summary.py --output artifacts/gdr_villa_exports/recreated_flux_summary.csv

      - name: Export row-level observation ledger with source locators
        run: >-
          python scripts/extract_gdr_villa_observation_ledger.py
          --output artifacts/gdr_villa_exports/observation_ledger.csv
          --manifest artifacts/gdr_villa_exports/observation_ledger_manifest.json

      - name: Verify ledger row count and independently recompute flux summary
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          from collections import defaultdict
          from pathlib import Path

          root = Path("artifacts/gdr_villa_exports")
          manifest = json.loads((root / "observation_ledger_manifest.json").read_text())
          with (root / "observation_ledger.csv").open(encoding="utf-8", newline="") as stream:
              ledger = list(csv.DictReader(stream))
          with (root / "recreated_flux_summary.csv").open(encoding="utf-8-sig", newline="") as stream:
              summary = list(csv.DictReader(stream))
          with (root / "Specifications.csv").open(encoding="utf-8-sig", newline="") as stream:
              specifications = list(csv.reader(stream))
          area_row = next(
              row for row in specifications
              if row and row[0].strip().lower() == "membrane surface area"
          )
          area_m2 = float(area_row[1])

          assert manifest["source_file_sha256"] == "5b80da45f991a8572a8a77372535cf0ba3dc40eb46a3c32c58e09e9d608dd8bb"
          assert len(ledger) == 631 == manifest["output_row_count"]
          assert len(summary) == 12
          assert len({row["worksheet_name"] for row in ledger}) == 12
          assert area_m2 > 0

          grouped = defaultdict(list)
          for row in ledger:
              grouped[row["worksheet_name"]].append(row)
          max_abs_diff = 0.0
          for item in summary:
              rows = grouped[item["condition_id"]]
              x = [float(row["runtime_hr"]) for row in rows]
              y = [float(row["distillate_volume_l"]) for row in rows]
              xbar = sum(x) / len(x)
              ybar = sum(y) / len(y)
              sxx = sum((value - xbar) ** 2 for value in x)
              slope = sum((a - xbar) * (b - ybar) for a, b in zip(x, y, strict=True)) / sxx
              recomputed = slope / area_m2
              difference = abs(recomputed - float(item["derived_flux_l_m2_h"]))
              max_abs_diff = max(max_abs_diff, difference)
              assert difference < 1e-6, (item["condition_id"], difference)
          print(f"Validated {len(ledger)} source rows across {len(summary)} conditions; max flux-summary difference={max_abs_diff:.3g} L m^-2 h^-1")
          PY

      - name: Upload raw workbook and inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdr-villa-3m-countercurrent
          path: |
            data/raw/gdr_villa_2018/*
            artifacts/provenance/gdr_villa_workbook_inspection.json
            artifacts/gdr_villa_exports/*
          if-no-files-found: error
          retention-days: 90
