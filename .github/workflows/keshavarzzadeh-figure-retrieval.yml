name: Retrieve secondary DCMD Figure 3 for calibrated digitization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve-figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image inspection dependency
        run: python -m pip install "Pillow>=10.0"
      - name: Retrieve and verify original figure image
        run: |
          python scripts/retrieve_keshavarzzadeh_fig3.py \
            --output artifacts/figure_digitization/keshavarzzadeh_2020_fig3.png \
            --manifest artifacts/figure_digitization/keshavarzzadeh_2020_fig3_manifest.json
      - name: Verify checksum, dimensions, and provenance warning
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("artifacts/figure_digitization")
          manifest = json.loads((root / "keshavarzzadeh_2020_fig3_manifest.json").read_text())
          image = root / "keshavarzzadeh_2020_fig3.png"
          assert manifest["status"] == "retrieved_and_image_verified"
          assert manifest["size_bytes"] == image.stat().st_size
          assert manifest["sha256"] == hashlib.sha256(image.read_bytes()).hexdigest()
          assert manifest["width_px"] >= 500 and manifest["height_px"] >= 250
          assert "Secondary-reproduced" in manifest["scientific_scope"]
          print("Verified Figure 3 image:", manifest["width_px"], "x", manifest["height_px"], manifest["sha256"])
          PY
      - name: Upload figure and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: keshavarzzadeh-2020-figure-3-source-image
          path: artifacts/figure_digitization/*
          if-no-files-found: error
          retention-days: 90
