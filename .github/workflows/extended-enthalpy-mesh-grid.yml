name: DCMD extended enthalpy mesh grid

on:
  push:
    branches: [main, research/extended-enthalpy-mesh-grid]
    paths:
      - "scripts/run_extended_enthalpy_mesh_convergence.py"
      - "tests/test_extended_enthalpy_mesh_convergence.py"
      - "src/ai_water/**"
      - ".github/workflows/extended-enthalpy-mesh-grid.yml"
  pull_request:
    paths:
      - "scripts/run_extended_enthalpy_mesh_convergence.py"
      - "tests/test_extended_enthalpy_mesh_convergence.py"
      - "src/ai_water/**"
      - ".github/workflows/extended-enthalpy-mesh-grid.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-mesh-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run expanded 96-case matrix
        run: python scripts/run_extended_enthalpy_mesh_convergence.py --output-dir artifacts/extended_enthalpy_mesh_convergence
      - name: Validate matrix, residuals, and artifact hashes
        run: |
          python - <<'PY'
          import csv, hashlib, json, math
          from pathlib import Path
          root = Path("artifacts/extended_enthalpy_mesh_convergence")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["row_count"] == 96, manifest
          assert manifest["case_count"] == 12
          assert manifest["cell_counts"] == [10, 20, 40, 80]
          assert manifest["reference_mesh_cells"] == 80
          for name, expected in manifest["files"].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected
          with (root / "extended_enthalpy_mesh_convergence.csv").open(newline="") as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == 96
          keys = {(r["case_id"], r["energy_balance_mode"], int(r["cells"])) for r in rows}
          assert len(keys) == 96
          for row in rows:
              for field in ("feed_out_temperature_c", "permeate_out_temperature_c",
                            "freshwater_produced_kg", "hot_side_thermal_demand_kwh_th",
                            "global_wyon_enthalpy_residual_w"):
                  assert math.isfinite(float(row[field])), (row, field)
              assert row["feed_out_temperature_c_relative_delta_vs_80_pct"] == ""
              assert row["permeate_out_temperature_c_relative_delta_vs_80_pct"] == ""
              if row["energy_balance_mode"] == "wyon_enthalpy":
                  assert abs(float(row["global_wyon_enthalpy_residual_w"])) < 1e-5
                  assert float(row["max_abs_combined_cell_residual_w"]) < 1e-7
              else:
                  assert row["max_abs_combined_cell_residual_w"] == ""
          print("Verified 96 mesh/mode/operating-point combinations.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: extended-enthalpy-mesh-grid
          path: artifacts/extended_enthalpy_mesh_convergence/*
          if-no-files-found: error
          retention-days: 90
