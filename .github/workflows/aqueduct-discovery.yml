name: Aqueduct 4.0 source asset discovery

on:
  push:
    branches: [main]
    paths:
      - "scripts/discover_aqueduct_assets.py"
      - "scripts/inspect_aqueduct_zip_directory.py"
      - "docs/GEOGRAPHIC_LAYER.md"
      - "configs/geography.yaml"
      - ".github/workflows/aqueduct-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-official-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover official WRI landing-page assets
        run: python scripts/discover_aqueduct_assets.py --output artifacts/aqueduct_discovery/aqueduct_asset_discovery.json

      - name: Inspect official Aqueduct ZIP central directory using byte ranges
        run: python scripts/inspect_aqueduct_zip_directory.py --output artifacts/aqueduct_discovery/aqueduct_zip_directory.json

      - name: Verify source-page provenance record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/aqueduct_discovery/aqueduct_asset_discovery.json")
          manifest = json.loads(path.read_text())
          assert manifest["dataset"] == "WRI Aqueduct Global Maps 4.0"
          assert manifest["pages"], manifest
          assert all(page["page_sha256"] for page in manifest["pages"]), manifest
          print(f"Retrieved {len(manifest['pages'])} official landing page(s); candidate asset links: {manifest['candidate_asset_url_count']}.")
          inventory = json.loads(Path("artifacts/aqueduct_discovery/aqueduct_zip_directory.json").read_text())
          assert inventory["directory_entry_count"] > 0, inventory
          assert inventory["archive_metadata"]["size_bytes"] > 0, inventory
          assert inventory["archive_sha256"] is None, inventory
          print("ZIP directory inventory verified; full archive not downloaded.")
          PY

      - name: Upload Aqueduct discovery metadata
        uses: actions/upload-artifact@v4
        with:
          name: aqueduct-asset-discovery
          path: artifacts/aqueduct_discovery/*.json
          if-no-files-found: error
          retention-days: 90
