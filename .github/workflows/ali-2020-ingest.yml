name: Ali et al. 2020 dynamic DCMD source-data ingestion

on:
  push:
    branches: [main]
    paths:
      - "scripts/download_ali_2020_data.py"
      - "scripts/extract_ali_2020_observations.py"
      - "scripts/extract_ali_2020_observation_ledger.py"
      - ".github/workflows/ali-2020-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install XLSX inspector
        run: python -m pip install "openpyxl>=3.1.2"

      - name: Retrieve five CC BY 4.0 supporting workbooks
        run: |
          python scripts/download_ali_2020_data.py \
            --output-dir data/raw/ali_2020 \
            --manifest artifacts/provenance/ali_2020_supporting_data_manifest.json

      - name: Verify five source objects and workbook structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("artifacts/provenance/ali_2020_supporting_data_manifest.json").read_text())
          assert len(manifest["files"]) == 5, manifest
          assert all(item["status"] == "downloaded_and_inspected" for item in manifest["files"]), manifest
          assert all(item["size_bytes"] > 1000 for item in manifest["files"]), manifest
          assert all(item["sheets"] for item in manifest["files"]), manifest
          print("Verified five supporting XLSX files:")
          for item in manifest["files"]:
              print(item["filename"], item["size_bytes"], item["sha256"])
          PY

      - name: Export lossless raw worksheet-row ledger
        run: |
          python scripts/extract_ali_2020_observation_ledger.py \
            --input-dir data/raw/ali_2020 \
            --output-dir artifacts/ali_2020_exports

      - name: Verify raw ledger coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("artifacts/ali_2020_exports/ali_2020_raw_observation_ledger_manifest.json").read_text())
          assert len(manifest["workbooks"]) == 5, manifest
          assert manifest["total_nonempty_rows_exported"] > 10000, manifest
          assert all(item["sha256"] for item in manifest["workbooks"]), manifest
          print("Verified raw worksheet ledger:", manifest["total_nonempty_rows_exported"], "nonempty source rows")
          PY

      - name: Extract source-linked transient and steady-state ledgers
        run: |
          python scripts/extract_ali_2020_observations.py \
            --input-dir data/raw/ali_2020 \
            --output-dir artifacts/ali_2020_exports

      - name: Verify observation ledger row counts and data-quality flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("artifacts/ali_2020_exports/ali_2020_observation_ledger_manifest.json").read_text())
          outputs = manifest["outputs"]
          assert outputs["transient_rows"] == 17385, outputs
          assert outputs["complete_time_series_rows"] == 16837, outputs
          assert outputs["temperature_only_no_timestamp_rows"] == 548, outputs
          assert outputs["other_incomplete_rows"] == 0, outputs
          assert outputs["steady_state_rows"] == 16, outputs
          assert outputs["tail_flux_check_rows"] == 34, outputs
          assert len(manifest["files"]) == 5, manifest
          print("Verified observation ledger:", json.dumps(outputs, indent=2))
          PY

      - name: Upload raw supporting files, observation ledgers, and provenance
        uses: actions/upload-artifact@v4
        with:
          name: ali-2020-dynamic-dcmd-source-data
          path: |
            data/raw/ali_2020/*.xlsx
            artifacts/provenance/ali_2020_supporting_data_manifest.json
            artifacts/ali_2020_exports/*
          if-no-files-found: error
          retention-days: 90
