name: Sensible versus Wyon enthalpy sensitivity

on:
  push:
    branches: [main, research/sensible-vs-wyon-enthalpy-sweep]
    paths:
      - "scripts/run_sensible_vs_wyon_enthalpy_sweep.py"
      - "tests/test_sensible_vs_wyon_enthalpy_sweep.py"
      - "src/ai_water/**"
      - ".github/workflows/sensible-vs-wyon-enthalpy-sweep.yml"
  pull_request:
    paths:
      - "scripts/run_sensible_vs_wyon_enthalpy_sweep.py"
      - "tests/test_sensible_vs_wyon_enthalpy_sweep.py"
      - "src/ai_water/**"
      - ".github/workflows/sensible-vs-wyon-enthalpy-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensible-wyon-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/run_sensible_vs_wyon_enthalpy_sweep.py --output-dir artifacts/sensible_vs_wyon_enthalpy_sweep
      - name: Verify matrix, residuals, and artifact hashes
        run: |
          python - <<'PY'
          import csv, hashlib, json, math
          from pathlib import Path
          root = Path('artifacts/sensible_vs_wyon_enthalpy_sweep')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['row_count'] == 12, manifest
          assert manifest['feed_temperatures_c'] == [40.0, 50.0, 60.0, 70.0]
          assert manifest['feed_reference_salinity_g_kg'] == [15.0, 35.0, 38.0]
          for name, expected in manifest['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected
          with (root / 'sensible_vs_wyon_enthalpy_sweep.csv').open(newline='') as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == 12
          for row in rows:
              for mode in ('sensible_cp', 'wyon_enthalpy'):
                  assert float(row[f'{mode}_freshwater_produced_kg']) > 0
                  assert float(row[f'{mode}_hot_side_thermal_demand_kwh_th']) > 0
                  assert math.isfinite(float(row[f'{mode}_global_wyon_enthalpy_residual_w']))
              assert abs(float(row['wyon_enthalpy_global_wyon_enthalpy_residual_w'])) < 1e-5
              assert float(row['wyon_enthalpy_max_abs_combined_cell_residual_w']) < 1e-8
              assert row['sensible_cp_max_abs_combined_cell_residual_w'] == ''
          print('Verified all 12 paired sensible-cp/Wyon-enthalpy cases.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sensible-vs-wyon-enthalpy-sweep
          path: artifacts/sensible_vs_wyon_enthalpy_sweep/*
          if-no-files-found: error
          retention-days: 90
